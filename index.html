<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101421"><title>Consistency Quest</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#0b0f19;--card:#151b2b;--ink:#f4f7ff;--muted:#9ca8c7;--accent:#70e1a1;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:600px;margin:auto;padding:18px 16px 90px}h1{font-size:25px;margin:5px 0}.sub{color:var(--muted);margin:0 0 18px}.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.xp{font-size:28px;font-weight:800;color:var(--gold)}.bar{height:10px;background:#293147;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}label{display:block;color:var(--muted);font-size:13px;margin-top:12px}input{width:100%;padding:13px;background:#0c1120;border:1px solid #36415f;border-radius:10px;color:white;font-size:16px}button{padding:12px 14px;border:0;border-radius:12px;background:var(--accent);font-weight:750;color:#08130d}.exercise{border-top:1px solid #2c354d;padding:10px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#101625;padding:10px;display:flex;justify-content:center;gap:8px}.nav button{background:#222b41;color:white}.small{font-size:13px;color:var(--muted)}
</style></head><body><div class="wrap"><h1>🎮 Consistency Quest</h1><p class="sub">Aaron's mobile tracker</p><section id="dash"><div class="card"><div class="row"><div><b>ACCOUNT LEVEL <span id="level">1</span></b><div class="small"><span id="axp">200</span> XP</div></div><div class="xp" id="todayxp">+200 XP</div></div><div class="bar"><i id="accountbar" style="width:81%"></i></div></div><div class="card"><h3>Today's skills</h3><div id="skills"></div></div><div class="card"><h3>Daily objectives</h3><div id="objs"></div></div></section><section id="log" hidden><div class="card"><h3>Log today</h3><label>Protein (g)</label><input id="protein" type="number" value="144"><label>Steps</label><input id="steps" type="number" value="5500"><label>Calories (tracking only, no XP)</label><input id="cal" type="number" value="1700"><br><br><button onclick="saveDay()">Save day</button></div><div class="card"><h3>Add strength exercise</h3><label>Exercise</label><input id="ename"><label>Weight (kg)</label><input id="weight" type="number"><label>Sets</label><input id="sets" type="number"><label>Reps per set</label><input id="reps" type="number"><br><br><button onclick="addEx()">Add exercise</button><div id="elist"></div></div></section><section id="history" hidden><div class="card"><h3>Strength baselines</h3><div id="baselines"></div><p class="small">Progress is compared only against the same exercise and unit. Higher load is not rewarded by itself.</p></div></section></div><nav class="nav"><button onclick="show('dash')">Dashboard</button><button onclick="show('log')">Log</button><button onclick="show('history')">Strength</button></nav><script src="app.js"></script></body></html>
